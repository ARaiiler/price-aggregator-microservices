# Docker Compose Configuration for Price Aggregator Microservices
# Production-ready setup with internal networking and security best practices

version: '3.8'

services:
  # MongoDB Database - Persistent storage for user data and cache
  mongodb:
    image: mongo:7.0
    container_name: price-aggregator-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-priceaggregator}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - internal-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # MongoDB not exposed externally for security

  # Redis Cache - Session management and caching layer
  redis:
    image: redis:7-alpine
    container_name: price-aggregator-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Redis not exposed externally for security

  # Python Collector Service - Product scraping and data collection
  # This service is INTERNAL ONLY - no external port exposure
  python-collector:
    build:
      context: ../python-collector
      dockerfile: Dockerfile
    container_name: price-aggregator-python-collector
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # NO PORTS - Internal communication only via container name

  # Node.js Gateway - API Gateway with JWT authentication
  node-gateway:
    build:
      context: ../node-gateway
      dockerfile: Dockerfile
    container_name: price-aggregator-node-gateway
    restart: unless-stopped
    ports:
      - "${NODE_GATEWAY_PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/${MONGO_DATABASE:-priceaggregator}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - PYTHON_SERVICE_URL=http://python-collector:8000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-collector:
        condition: service_healthy
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # React Frontend - User interface
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: price-aggregator-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:${NODE_GATEWAY_PORT:-5000}
    depends_on:
      - node-gateway
    networks:
      - internal-network

# Named volumes for data persistence
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

# Internal bridge network for secure service communication
networks:
  internal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
