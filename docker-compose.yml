# docker-compose.yml  –  Python Collector + Redis
# Launch with:  docker-compose up --build

services:
  # ── Python Collector (Backend A) ──────────────────────
  python-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-collector
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # ── Redis (price history cache) ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: collector-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis_data:

networks:
  backend:
    driver: bridge
